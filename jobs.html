<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Current Opportunities | OakRise Point</title>
    <link rel="icon" type="image/png" sizes="32x32" href="oakrise-favicon.png?v=4" />
    <link rel="shortcut icon" type="image/png" href="oakrise-favicon.png?v=4" />
    <meta name="description" content="Explore current job opportunities represented by OakRise Point." />
    <style>
      :root {
        --navy: #082f61;
        --green: #087c65;
        --text: #526a89;
        --pearl: #f6f2ea;
        --pearl2: #f1ede5;
        --card: #faf8f3;
        --field: #fdfbf7;
        --line: #d7d2c9;
        --softblue: #e8f0f3;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; color: var(--navy); background: var(--pearl); font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; }
      a { color: inherit; text-decoration: none; }
      button, input, textarea { font: inherit; }
      button { cursor: pointer; }
      .wrap { width: min(1180px, calc(100% - 48px)); margin: auto; }
      header { min-height: 90px; background: var(--pearl); border-bottom: 1px solid #e5dfd5; display: flex; align-items: center; }
      .nav { display: flex; align-items: center; width: min(1440px, calc(100% - 96px)); margin: auto; }
      .brand { margin-right: auto; display: flex; align-items: center; }
      .brand-logo { display: block; width: 405px; height: 82px; object-fit: contain; object-position: left center; }
      nav { display: flex; gap: 30px; align-items: center; }
      nav a { padding: 11px 0; }
      nav a:hover, nav a.active { color: var(--green); }
      nav a.active { border-bottom: 3px solid var(--green); }
      main { flex: 1; padding: 58px 0 72px; }
      .heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
      h1 { margin: 0 0 8px; font-family: Georgia, serif; font-size: clamp(38px, 5vw, 58px); font-weight: 500; }
      .heading p { margin: 0; color: var(--text); font-size: 18px; }
      .search { width: min(340px, 100%); min-height: 46px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: #24384e; padding: 0 14px; }
      .jobs { display: grid; gap: 18px; }
      .job { display: grid; grid-template-columns: minmax(0, 1fr) 210px; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
      .job-main { padding: 25px 27px; }
      .job-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; }
      .job-title { margin: 0 0 4px; color: var(--navy); font-family: Georgia, serif; font-size: 26px; font-weight: 500; }
      .job-id { color: var(--text); font-size: 13px; }
      .badge { padding: 6px 10px; border-radius: 999px; background: #e4f2ee; color: var(--green); font-size: 12px; font-weight: 700; white-space: nowrap; }
      .meta { margin: 14px 0; display: flex; flex-wrap: wrap; gap: 7px 18px; color: var(--text); font-size: 14px; }
      .description { margin: 0 0 16px; color: #365474; }
      .skills { display: flex; flex-wrap: wrap; gap: 7px; }
      .skill { padding: 5px 9px; border-radius: 6px; background: var(--softblue); color: var(--navy); font-size: 13px; }
      .details { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); color: #365474; white-space: pre-wrap; }
      .job-side { padding: 24px 18px; background: var(--pearl2); border-left: 1px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; gap: 20px; }
      .reviewed { color: var(--text); font-size: 13px; }
      .reviewed strong { display: block; margin-top: 4px; color: var(--navy); }
      .actions { display: grid; gap: 9px; }
      .primary, .secondary { width: 100%; min-height: 44px; border-radius: 8px; padding: 9px 12px; font-weight: 700; }
      .primary { border: 0; background: var(--green); color: #fff; }
      .secondary { border: 1px solid var(--green); background: transparent; color: var(--green); }
      .loading, .empty, .error { padding: 48px 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); text-align: center; }
      .error { color: #8a3e2b; }
      footer { background: #203746; color: #fff; padding: 21px 0; }
      .footer { display: flex; align-items: center; gap: 24px; }
      .footer-brand { font-weight: 700; }
      .copyright { margin-left: 0; font-size: 13px; color: #e3e7e9; }
      .copyright a { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
      .copyright a:hover { color: #8fdcc8; }
      .social { display: flex; gap: 10px; }
      .social span { width: 31px; height: 31px; border-radius: 50%; background: rgba(255,255,255,.13); display: grid; place-items: center; font-weight: 700; }
      .overlay { position: fixed; inset: 0; z-index: 30; display: none; justify-content: flex-end; background: rgba(9,32,51,.56); }
      .overlay.open { display: flex; }
      .application { width: min(620px, 100%); min-height: 100vh; background: var(--pearl); display: flex; flex-direction: column; }
      .application-head { padding: 24px 26px; background: var(--navy); color: #fff; display: flex; justify-content: space-between; gap: 18px; }
      .application-head h2 { margin: 0 0 4px; font-family: Georgia, serif; font-size: 27px; font-weight: 500; }
      .application-head p { margin: 0; color: #c7d7df; font-size: 13px; }
      .close { width: 38px; height: 38px; border: 1px solid rgba(255,255,255,.35); border-radius: 8px; background: transparent; color: #fff; font-size: 22px; }
      .application-body { flex: 1; overflow: auto; padding: 24px 26px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .field { margin-bottom: 15px; }
      .field.full { grid-column: 1 / -1; }
      label { display: block; margin-bottom: 6px; color: #365474; font-size: 14px; font-weight: 700; }
      input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: #24384e; padding: 11px 12px; }
      textarea { min-height: 105px; resize: vertical; }
      .consent { display: flex; gap: 9px; align-items: flex-start; color: var(--text); font-size: 13px; }
      .consent input { width: auto; margin-top: 4px; }
      .status { min-height: 24px; margin: 12px 0 0; color: var(--green); }
      .application-foot { padding: 16px 26px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 9px; }
      .application-foot button { width: auto; min-width: 130px; }
      [hidden] { display: none !important; }
      @media (max-width: 850px) {
        .nav { width: min(100% - 36px, 1440px); align-items: flex-start; gap: 18px; }
        .brand-logo { width: 310px; height: 68px; }
        nav { gap: 16px; flex-wrap: wrap; justify-content: flex-end; }
        .heading { align-items: flex-start; flex-direction: column; }
        .search { width: 100%; }
      }
      @media (max-width: 700px) {
        .wrap { width: min(100% - 28px, 1180px); }
        header { padding: 10px 0; }
        .nav { display: block; }
        .brand-logo { width: 285px; height: 64px; }
        nav { margin-top: 8px; justify-content: center; }
        .job { grid-template-columns: 1fr; }
        .job-side { border-left: 0; border-top: 1px solid var(--line); }
        .grid { grid-template-columns: 1fr; }
        .field.full { grid-column: auto; }
        .footer { flex-wrap: wrap; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="nav">
        <a class="brand" href="index.html" aria-label="OakRise Point home"><img class="brand-logo" src="oakrise-point-logo.png" alt="OakRise Point Solutions" /></a>
        <nav><a href="index.html">Home</a><a href="index.html#about">About</a><a class="active" href="jobs.html">Available Jobs</a><a href="index.html#contact">Contact</a></nav>
      </div>
    </header>
    <main>
      <div class="wrap">
        <div class="heading"><div><h1>Current Opportunities</h1><p>Explore open positions represented by OakRise Point.</p></div><input class="search" id="job-search" type="search" placeholder="Search jobs, locations, or skills" /></div>
        <div class="jobs" id="jobs-list"><div class="loading">Loading current opportunities…</div></div>
      </div>
    </main>
    <footer>
      <div class="wrap footer">
        <div class="footer-brand"></div>
        <div class="copyright" style="text-align: left">
          <div>© 2026 OakRise Point LLC</div>
          <a href="privacy-policy.html" style="display: block; margin-top: 4px">Privacy Policy</a>
        </div>
        <div class="social" aria-label="Social links coming soon">
          <span title="LinkedIn">in</span>
          <span title="Facebook" style="font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; line-height: 1;">f</span>
        </div>
      </div>
    </footer>

    <div class="overlay" id="application-overlay" aria-hidden="true">
      <form class="application" id="application-form">
        <header class="application-head"><div><h2>Apply for This Job</h2><p id="application-job"></p></div><button class="close" type="button" data-close aria-label="Close">×</button></header>
        <div class="application-body"><input type="hidden" name="jobId" /><input type="hidden" name="jobTitle" /><div class="grid"><div class="field"><label>First name *</label><input required name="firstName" /></div><div class="field"><label>Last name *</label><input required name="lastName" /></div><div class="field"><label>Email *</label><input required type="email" name="email" /></div><div class="field"><label>Phone *</label><input required name="phone" /></div><div class="field full"><label>Current location *</label><input required name="location" placeholder="City, State" /></div><div class="field full"><label>LinkedIn profile</label><input type="url" name="linkedin" /></div><div class="field full"><label>Résumé *</label><input required type="file" name="resume" accept=".pdf,.doc,.docx" /></div><div class="field full"><label>Short message</label><textarea name="message" placeholder="Tell us briefly about your relevant experience"></textarea></div><label class="consent field full"><input required type="checkbox" name="consent" value="Yes" /><span>I agree that OakRise Point may review and use my information for recruiting purposes. The Privacy Policy applies.</span></label></div><p class="status" id="application-status" aria-live="polite"></p></div>
        <footer class="application-foot"><button class="secondary" type="button" data-close>Cancel</button><button class="primary" type="submit">Submit Application</button></footer>
      </form>
    </div>

    <script>
      const JOBS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbw_EohrMetkyYZibZ0Brz1fqTossn1bEvLAL_doac8MnSbXapmrzVzUWxSDGRrvshIR/exec';
      const state = { jobs: [] };
      const clean = value => value === undefined || value === null ? '' : String(value).trim();
      const escapeHtml = value => clean(value).replace(/[&<>'"]/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[character]);
      const splitSkills = value => clean(value).split(/[,|]/).map(item => item.trim()).filter(Boolean);

      async function loadJobs() {
        const list = document.getElementById('jobs-list');
        if (JOBS_ENDPOINT.startsWith('REPLACE_')) {
          list.innerHTML = '<div class="empty">The new Jobs page is ready. Current openings will appear here after the separate jobs service is connected.</div>';
          return;
        }
        try {
          const response = await fetch(JOBS_ENDPOINT);
          const data = await response.json();
          if (!data.success) throw new Error(data.message || 'Jobs could not be loaded.');
          state.jobs = data.jobs || [];
          renderJobs();
        } catch (error) {
          console.error(error);
          list.innerHTML = '<div class="error">Current opportunities could not be loaded. Please try again later.</div>';
        }
      }

      function renderJobs() {
        const query = document.getElementById('job-search').value.toLowerCase();
        const jobs = state.jobs.filter(job => [job.jobTitle, job.location, job.skills, job.publicDescription].join(' ').toLowerCase().includes(query));
        const list = document.getElementById('jobs-list');
        if (!jobs.length) { list.innerHTML = '<div class="empty">No current opportunities match your search.</div>'; return; }
        list.innerHTML = jobs.map(job => {
          const skills = splitSkills(job.skills).map(skill => '<span class="skill">' + escapeHtml(skill) + '</span>').join('');
          const metadata = [job.location, job.workArrangement, job.employmentType, job.payRange].filter(Boolean).map(item => '<span>' + escapeHtml(item) + '</span>').join('');
          return '<article class="job"><div class="job-main"><div class="job-head"><div><h2 class="job-title">' + escapeHtml(job.jobTitle) + '</h2><div class="job-id">Job ID: ' + escapeHtml(job.jobId) + '</div></div><span class="badge">Actively recruiting</span></div><div class="meta">' + metadata + '</div><p class="description">' + escapeHtml(job.publicDescription) + '</p><div class="skills">' + skills + '</div><div class="details" id="details-' + escapeHtml(job.jobId) + '" hidden>' + escapeHtml(job.requirements) + '</div></div><aside class="job-side"><div class="reviewed">Applications reviewed by<strong>OakRise Point LLC</strong></div><div class="actions"><button class="secondary" type="button" data-details="' + escapeHtml(job.jobId) + '">View Full Details</button><button class="primary" type="button" data-apply="' + escapeHtml(job.jobId) + '">Apply for This Job</button></div></aside></article>';
        }).join('');
        document.querySelectorAll('[data-details]').forEach(button => button.addEventListener('click', () => { const details = document.getElementById('details-' + button.dataset.details); details.hidden = !details.hidden; button.textContent = details.hidden ? 'View Full Details' : 'Hide Details'; }));
        document.querySelectorAll('[data-apply]').forEach(button => button.addEventListener('click', () => openApplication(button.dataset.apply)));
      }

      function openApplication(jobId) {
        const job = state.jobs.find(item => clean(item.jobId) === clean(jobId));
        if (!job) return;
        const form = document.getElementById('application-form');
        form.reset();
        form.elements.jobId.value = job.jobId;
        form.elements.jobTitle.value = job.jobTitle;
        document.getElementById('application-job').textContent = job.jobTitle + ' · ' + job.jobId;
        document.getElementById('application-status').textContent = '';
        document.getElementById('application-overlay').classList.add('open');
        document.getElementById('application-overlay').setAttribute('aria-hidden', 'false');
      }

      function closeApplication() { document.getElementById('application-overlay').classList.remove('open'); document.getElementById('application-overlay').setAttribute('aria-hidden', 'true'); }
      function fileToBase64(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result).split(',')[1]); reader.onerror = reject; reader.readAsDataURL(file); }); }

      document.getElementById('application-form').addEventListener('submit', async event => {
        event.preventDefault();
        const form = event.currentTarget;
        const status = document.getElementById('application-status');
        const button = form.querySelector('[type="submit"]');
        const file = form.elements.resume.files[0];
        if (!file) { status.textContent = 'Please select your résumé.'; return; }
        if (file.size > 10 * 1024 * 1024) { status.textContent = 'Please upload a résumé smaller than 10 MB.'; return; }
        if (!/\.(pdf|doc|docx)$/i.test(file.name)) { status.textContent = 'Please upload a PDF, DOC, or DOCX résumé.'; return; }
        button.disabled = true; button.textContent = 'Submitting…'; status.textContent = '';
        try {
          const payload = Object.fromEntries(new FormData(form).entries());
          delete payload.resume;
          payload.action = 'apply';
          payload.consent = form.elements.consent.checked ? 'Yes' : '';
          payload.resume = { name: file.name, type: file.type || 'application/octet-stream', data: await fileToBase64(file) };
          const response = await fetch(JOBS_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
          const data = await response.json();
          if (!data.success) throw new Error(data.message || 'Submission failed.');
          form.reset(); status.textContent = 'Thank you. Your application was submitted successfully.';
        } catch (error) {
          console.error(error); status.textContent = error.message || 'Your application could not be submitted. Please try again.';
        } finally { button.disabled = false; button.textContent = 'Submit Application'; }
      });
      document.getElementById('job-search').addEventListener('input', renderJobs);
      document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', closeApplication));
      document.getElementById('application-overlay').addEventListener('click', event => { if (event.target === event.currentTarget) closeApplication(); });
      document.addEventListener('keydown', event => { if (event.key === 'Escape') closeApplication(); });
      loadJobs();
    </script>
  </body>
</html>
